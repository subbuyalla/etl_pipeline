id: 6a72cce1d2a5c44a535440dc
name: Obs List Runs
description: List recent pipeline runs from Metadata MySQL with optional status and time_window filters
type: FAAS
input_modes:
- application/json
output_modes:
- application/json
systemInstructions:
- Use for run history, today's failures, or finding the latest failed run_id for RCA.
- Requires pipeline_id. Optional status (success|failed|running|unknown). Optional time_window (today|yesterday|last_24h|last_7_days).
- time_window is resolved by MySQL clock — never invent calendar dates yourself.
- Response includes server_now, window metadata, rows_added, duration_seconds + duration_display (SECONDS), and shortened error_message.
arguments:
  limit:
    description: Max runs to return (default 20, max 100)
    required: false
    type: number
  pipeline_id:
    description: Pipeline UUID OR pipeline name (e.g. stock_etl) — name is resolved automatically
    required: true
    type: string
  pipeline_name:
    description: Optional pipeline name if not using pipeline_id
    required: false
    type: string
  status:
    description: Optional status filter (success, failed, running, unknown)
    required: false
    type: string
  time_window:
    description: today | yesterday | last_24h | last_7_days — omit for latest N runs
    required: false
    type: string
examples:
- Show today's failures for stock_etl
- List recent runs
tags:
- etl
- observability
- runs
