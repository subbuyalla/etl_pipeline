id: 6a72ccdfd2a5c44a535440db
name: Obs Get Pipeline
description: Get one ETL pipeline attach config from Metadata MySQL by pipeline_id
type: FAAS
input_modes:
- application/json
output_modes:
- application/json
systemInstructions:
- Use after the user has chosen a pipeline_id (or when only one pipeline exists).
- Returns full attach detail from obs_pipelines for coarse lineage (source → etl → target).
- Requires pipeline_id. Do not call with a guessed id.
arguments:
  pipeline_id:
    description: Pipeline UUID OR pipeline name (e.g. stock_etl, ecommerce_etl, hr_etl) — name is resolved automatically
    required: true
    type: string
  pipeline_name:
    description: Optional pipeline name if not using pipeline_id (exact name from obs-list-pipelines)
    required: false
    type: string
examples:
- Show attach details for stock_etl
- Show attach details for hr_etl
- Show attach details for ecommerce_etl
tags:
- etl
- observability
- lineage
createdBy: ''
managedBy: []
version: '1.0'
