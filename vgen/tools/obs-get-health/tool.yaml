id: 6a72cce3d2a5c44a535440de
name: Obs Get Health
description: Compute pipeline health — freshness, volume deltas, success rate, coarse lineage — from Metadata MySQL
type: FAAS
input_modes:
- application/json
output_modes:
- application/json
systemInstructions:
- Primary tool for is-it-healthy, freshness, volume, success rate, and coarse lineage questions.
- Accepts pipeline_id as UUID OR pipeline name (e.g. stock_etl, ecommerce_etl, hr_etl). pipeline_name also works. Use exact names from obs-list-pipelines.
- 'Optional run_date (YYYY-MM-DD UTC) or YYYY-MM-DD as time_window for metrics on a specific day.'
- Freshness and windows use MySQL UTC_TIMESTAMP — quote server_now in the answer.
- rows_added on latest_run = net new target rows vs previous run (0 = no table growth).
- latest_run is always the most recent run overall, even when time_window filters metrics.
- avg_duration_seconds / duration_seconds are SECONDS. Also returns avg_duration_display — agents must quote these, never invent minutes.
- Do not invent metrics; only report numbers returned here.
arguments:
  lookback_runs:
    description: When time_window is omitted, how many recent runs to use for success rate (default 10)
    required: false
    type: number
  pipeline_id:
    description: Pipeline UUID OR pipeline name (e.g. stock_etl, ecommerce_etl, hr_etl) — name is resolved automatically
    required: true
    type: string
  pipeline_name:
    description: Optional pipeline name if not using pipeline_id (exact name from obs-list-pipelines)
    required: false
    type: string
  run_date:
    description: Optional calendar date (YYYY-MM-DD UTC) for success-rate / runs_in_scope on that day
    required: false
    type: string
  sla_hours:
    description: Max allowed freshness lag in hours (default 24)
    required: false
    type: number
  time_window:
    description: 'Metrics window: today | yesterday | last_24h | last_7_days | YYYY-MM-DD | omit for last 10 runs'
    required: false
    type: string
examples:
- Is stock_etl healthy?
- Is hr_etl healthy?
- What is today's success rate for ecommerce_etl?
- What was stock_etl health on 2026-08-05?
tags:
- etl
- observability
- freshness
- volume
- metrics
