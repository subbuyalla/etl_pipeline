id: 6a72cce2d2a5c44a535440dd
name: Obs Get Run Detail
description: Get one pipeline run plus SOURCE/TARGET assets for RCA from Metadata MySQL
type: FAAS
input_modes:
- application/json
output_modes:
- application/json
systemInstructions:
- Use for root-cause analysis after you have a run_id (often from obs-list-runs with status=failed).
- 'Returns the run row (error_message, failure_stage, failed_node, failed_message, failed_nodes, error_class, rows_added) and SOURCE/TARGET assets.'
- 'For failures: lead with failure_stage + error_class + failed_node + full error_message/failed_message. Do not invent location.'
arguments:
  run_id:
    description: Run id (obs_pipeline_runs.id — usually the dbt run id)
    required: true
    type: string
examples:
- Why did this run fail?
tags:
- etl
- rca
- observability
createdBy: ''
managedBy: []
version: '1.0'
functionId: 8697136d-07bb-4532-9cd8-6b90169f9cca
