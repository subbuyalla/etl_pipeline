id: 6a796afad2a5c44a53544204
name: Obs Last Success
description: Last successful run details for one or many pipelines (timestamps, duration, row counts)
type: FAAS
input_modes:
- application/json
output_modes:
- application/json
systemInstructions:
- Use when the user asks for the last successful execution/run of one or more pipelines.
- Pass pipeline_names as a comma-separated list (e.g. ecommerce_etl,stock_etl) or a single name.
- Returns start_time, end_time, duration, rows_read/written/added per pipeline. If none, found=false — do not invent 100% success.
- Do NOT use obs-compare-runs for last-success questions (compare is for failed vs success RCA).
arguments:
  pipeline_name:
    description: Optional single pipeline name if pipeline_names omitted
    required: false
    type: string
  pipeline_names:
    description: Comma-separated pipeline names, e.g. ecommerce_etl,stock_etl — or one name
    required: true
    type: string
examples:
- What was the last successful execution of ecommerce_etl and stock_etl?
- When did stock_etl last succeed?
- Show the last successful run details for hr_etl
tags:
- etl
- observability
- runs
- success
