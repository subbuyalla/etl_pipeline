services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metadata
      MYSQL_USER: obs
      MYSQL_PASSWORD: obs
    ports:
      - "3306:3306"
    volumes:
      - obs_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: obs
      DB_PASSWORD: obs
      DB_NAME: metadata
      FREEMIUM_MAX_PIPELINES: "50"
      RAW_RETENTION_DAYS: "30"
    ports:
      - "8002:8002"
    depends_on:
      mysql:
        condition: service_healthy

  poller:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "application/poller.py"]
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: obs
      DB_PASSWORD: obs
      DB_NAME: metadata
      SYNC_INTERVAL_SECONDS: "300"
      POLLER_RUN_EVALUATE: "1"
      POLLER_RUN_ROLLUP: "1"
      POLLER_RUN_PURGE: "1"
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  obs_mysql_data:
